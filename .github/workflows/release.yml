name: Create Release

on:
  push:
    tags: [ 'v*.*.*' ]

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Web
        run: |
          flutter pub get
          flutter build web --release
      - name: Zip Web Build
        working-directory: build/web
        run: zip -r ../../vapor-web.zip .
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vapor-web
          path: vapor-web.zip
          retention-days: 1

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Android APK
        run: |
          flutter pub get
          flutter build apk --release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Windows
        run: |
          flutter pub get
          flutter build windows --release
      - name: Zip Windows Build
        working-directory: build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath ../../../../../vapor-windows.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vapor-windows
          path: vapor-windows.zip
          retention-days: 1

  release:
    name: Publish Release
    needs: [build-web, build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: vapor-web
          
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: vapor-windows
          
      - name: Generate Changelog
        id: changelog
        run: |
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s" > changelog.txt
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true
        
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            vapor-windows.zip
            vapor-web.zip
          body_path: changelog.txt
          generate_release_notes: true
