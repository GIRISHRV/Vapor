name: Vapor CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Cache Pub Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Run Linter
        run: flutter analyze

      - name: Run Tests
        run: flutter test
        
      - name: Build Web
        run: flutter build web --release
        
      - name: Build Android APK
        run: flutter build apk --release
        
      - name: Build Windows
        run: flutter build windows --release
        
      - name: Zip Windows Build
        working-directory: build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath ../../../../../vapor-windows.zip
        
      - name: Zip Web Build
        working-directory: build/web
        run: Compress-Archive -Path * -DestinationPath ../../vapor-web.zip
        
      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s" > changelog.txt
          echo "notes=$(cat changelog.txt)" >> $env:GITHUB_OUTPUT
        continue-on-error: true
        
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            vapor-windows.zip
            vapor-web.zip
          body_path: changelog.txt
          generate_release_notes: true

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VAPOR_ENGINE }}'
          projectId: vapor-engine
          channelId: live

      - name: Stop Gradle Daemon
        working-directory: android
        run: ./gradlew --stop
